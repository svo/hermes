- name: Install Claude Code
  community.general.npm:
    name: '@anthropic-ai/claude-code'
    global: true
  become: true

- name: Add Context7 MCP Server to Claude Code
  ansible.builtin.shell: >
    claude mcp add --transport http --scope user context7 https://mcp.context7.com/mcp
  register: claude_mcp_add_context7
  changed_when: "'Added MCP server' in claude_mcp_add_context7.stdout or 'Successfully added' in claude_mcp_add_context7.stdout"
  failed_when: false

- name: Add Sequential Thinking MCP Server to Claude Code
  ansible.builtin.shell: >
    claude mcp add --scope user sequential-thinking npx -- -y @modelcontextprotocol/server-sequential-thinking
  register: claude_mcp_add_sequential
  changed_when: "'Added MCP server' in claude_mcp_add_sequential.stdout or 'Successfully added' in claude_mcp_add_sequential.stdout"
  failed_when: false

- name: Install CLI tools to assist Claude Code
  ansible.builtin.apt:
    name:
      - jq
      - procps
      - ripgrep
      - fd-find
      - tree
    state: present
  become: true

- name: Ensure apt keyrings directory exists for GitHub CLI
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add GitHub CLI apt keyring
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  become: true

- name: Resolve Debian package architecture for GitHub CLI
  ansible.builtin.set_fact:
    claude_code_gh_deb_arch: "{{ ansible_facts['architecture'] | regex_replace('^x86_64$', 'amd64') | regex_replace('^aarch64$', 'arm64') }}"

- name: Add GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: 'deb [arch={{ claude_code_gh_deb_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main'
    filename: github-cli
    state: present
    update_cache: true
  become: true

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
  become: true

- name: Create tmux-agent-status install directory
  ansible.builtin.file:
    path: "{{ claude_code_tmux_agent_status_path | dirname }}"
    state: directory
    mode: '0755'

- name: Install tmux-agent-status agent waiting signal
  ansible.builtin.copy:
    src: tmux-agent-status
    dest: "{{ claude_code_tmux_agent_status_path }}"
    mode: '0755'

- name: Create Claude Code configuration directory
  ansible.builtin.file:
    path: "{{ claude_code_settings_path | dirname }}"
    state: directory
    mode: '0755'

- name: Check Claude Code user settings file
  ansible.builtin.stat:
    path: "{{ claude_code_settings_path }}"
  register: claude_code_settings_stat

- name: Read Claude Code user settings file
  ansible.builtin.slurp:
    src: "{{ claude_code_settings_path }}"
  register: claude_code_settings_file
  when: claude_code_settings_stat.stat.exists

- name: Merge Claude Code tmux-agent-status hooks
  ansible.builtin.command:
    argv:
      - jq
      - --null-input
      - --arg
      - script
      - "{{ claude_code_tmux_agent_status_path }}"
      - "{{ lookup('ansible.builtin.file', 'claude-code-hooks.jq') }}"
    stdin: "{{ claude_code_settings_file.content | default('') | b64decode | default('{}', true) }}"
  register: claude_code_settings_merged
  changed_when: false
  check_mode: false

- name: Configure Claude Code tmux-agent-status hooks
  ansible.builtin.copy:
    content: "{{ claude_code_settings_merged.stdout }}\n"
    dest: "{{ claude_code_settings_path }}"
    mode: "{{ claude_code_settings_stat.stat.mode | default('0644') }}"
  when: claude_code_settings_merged.stdout | length > 0
