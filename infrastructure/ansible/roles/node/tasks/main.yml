- name: Install prerequisites for Node.js
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
  become: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: '0644'
  become: true

- name: Add NodeSource GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
    creates: /etc/apt/keyrings/nodesource.gpg
  become: true

- name: Remove the repositories of retired Node.js majors
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ item }}.x nodistro main'
    state: absent
    filename: nodesource
  loop: "{{ node_retired_majors }}"
  become: true

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main'
    state: present
    filename: nodesource
  become: true

- name: Install Node.js {{ node_major }}
  ansible.builtin.apt:
    name:
      - nodejs
    update_cache: true
  become: true

- name: Read the installed Node.js version
  ansible.builtin.command:
    cmd: node --version
  register: node_installed_version
  changed_when: false

- name: Check that Node.js is new enough for OpenClaw
  ansible.builtin.assert:
    that:
      - node_installed_version.stdout | regex_replace('^v', '') is version(node_minimum_version, '>=')
      - node_installed_version.stdout | regex_replace('^v', '') is version(((node_major | int) + 1) | string, '<')
    fail_msg: >-
      Node.js {{ node_installed_version.stdout }} is installed and OpenClaw needs
      {{ node_minimum_version }} or later in the {{ node_major }} line. An earlier
      Node.js stays installed when the repository changes; run
      `apt-get install nodejs` to replace it.

- name: Install global npm packages
  community.general.npm:
    name: '{{ item }}'
    global: true
  loop:
    - typescript
    - ts-node
  become: true
