name: Lint and test gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ./bin/test
    runs-on: [ubuntu-latest]

    timeout-minutes: 20

    env:
      BUILDER_IMAGE: svanosselaer/hermes-builder:latest

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: docker-pull
        name: Docker:Pull
        run: |
          if docker pull "$BUILDER_IMAGE"; then
            exit 0
          fi
          echo "Could not pull ${BUILDER_IMAGE}. The gate did not run;" >&2
          echo "it is failing rather than being skipped. See README.md," >&2
          echo "'When a check is skipped', for how to publish the image by hand." >&2
          echo "::error title=Gate did not run::cannot pull builder image"
          exit 1

      - id: bin-test
        name: Docker:Test
        run: |
          docker run --rm -v "$PWD":/working-dir \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/working-dir \
            "$BUILDER_IMAGE"
